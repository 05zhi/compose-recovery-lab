# yaml-language-server: $schema=../../internal/config/schema.json
schema_version: 1
name: inventory-app
template: inventory-app-v1
backup:
  type: local_bundle
  path: ../../backups/inventory-complete
  mapping:
    database: database.dump
    uploads: uploads.tar
    app_config: app-config.sanitized.json
runtime:
  images_file: ./images.lock.json
  work_dir: /var/tmp/compose-recovery-lab-inventory
  timeout: 10m
checks:
  - {id: sql-inventory, required: true}
  - {id: database-files, required: true}
  - {id: inventory-export, required: true}
  - {id: external-connectivity, required: true}
report:
  formats: [json, html]
