<!doctype html><html lang="en"><meta charset="utf-8"><title>Recovery Lab Documents</title>
<style>body{font:18px system-ui;max-width:900px;margin:48px auto;padding:20px;background:#f6f8fa;color:#162d3d}input,button{font:inherit;padding:10px;margin:6px}article{background:white;padding:16px;margin:12px;border-radius:8px}#message{min-height:30px}</style>
<h1>Recovery Lab Documents</h1><p>Synthetic recovery fixture · local isolated environment</p>
<form id="login"><label>Username <input id="username" value="demo" autocomplete="off"></label><label>Password <input id="password" type="password" autocomplete="off"></label><button>Sign in</button></form>
<form id="search" hidden><label>Search <input id="query" value="Document"></label><button>Search</button></form><p id="message" role="status"></p><main id="results"></main>
<script>
let token='';const $=id=>document.getElementById(id);
$('login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});if(!r.ok)throw Error();token=(await r.json()).token;$('password').value='';$('login').hidden=true;$('search').hidden=false;$('message').textContent='Signed in';}catch{$('message').textContent='Sign in failed'}};
$('search').onsubmit=async e=>{e.preventDefault();$('results').replaceChildren();try{const r=await fetch('/documents?q='+encodeURIComponent($('query').value),{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error();const data=await r.json();for(const doc of data.documents){const article=document.createElement('article'),label=document.createElement('span'),button=document.createElement('button');label.textContent=doc.title;button.textContent='Download';button.onclick=async()=>{try{const response=await fetch('/download/'+doc.id,{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw Error();const blob=await response.blob(),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='document-'+doc.id+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}catch{$('message').textContent='Download failed'}};article.append(label,button);$('results').append(article)}$('message').textContent=data.documents.length+' documents';}catch{$('message').textContent='Search failed'}};
</script></html>
